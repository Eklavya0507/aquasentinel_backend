services:
  postgres:
    image: postgres:16
    container_name: aquasentinel-postgres
    environment:
      POSTGRES_DB: aquasentinel
      POSTGRES_USER: aquasentinel
      POSTGRES_PASSWORD: aquasentinel
    ports:
      - "5432:5432"
    volumes:
      - aquasentinel_pgdata:/var/lib/postgresql/data

volumes:
  aquasentinel_pgdata:
